<section class="home-section">
  <div class="home-header">
    <div class="title">Header</div>
    <div class="spacer">
      <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="menu-item">

        <mat-icon matBadge="{{ unreadCount }}" matBadgeColor="warn">
          notifications
        </mat-icon>

      </button>
      <mat-menu #notificationMenu="matMenu" panelClass="notification-menu">
        <div class="notification-panel">
          <h3>Broadcast Messages</h3>
          <mat-divider></mat-divider>
          <app-notifications [viewType]="'navbar'" (UnreadCount)="receiveUnreadCount($event)"
            #notifComponent></app-notifications>
        </div>
      </mat-menu>
    </div>
  </div>
</section>
