<div class="monitoring-content">
        <ng-container *ngIf="tabName === MonitoringTabName.RATERTRAINING">
            <div class="monitoring-tab-content">
                <app-rater-training></app-rater-training>
            </div>
        </ng-container>

        <ng-container *ngIf="tabName === MonitoringTabName.RATERCALIBRATION">
            <div class="monitoring-tab-content">
                <app-rater-calibration></app-rater-calibration>
            </div>
        </ng-container>

        <ng-container *ngIf="tabName === MonitoringTabName.BACKRATING">
            <div class="monitoring-tab-content">
                <app-backrating></app-backrating>
            </div>
        </ng-container>

        <ng-container *ngIf="tabName === MonitoringTabName.BACKRATINGREVIEW">
            <div class="monitoring-tab-content">
                <app-backrating-review></app-backrating-review>
            </div>
        </ng-container>

</div>
