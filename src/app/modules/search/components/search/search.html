<div class="search-container">
    <div class="search-pannal">
        <mat-sidenav-container>
            <div class="search-form-container">
                <div class="top-filters">
                    <app-top-filters [filterConfig]="filterConfig">
                    </app-top-filters>
                </div>
                <div class="more-filters">
                    <app-more-filters [filterConfig]="filterConfig">
                    </app-more-filters>
                </div>
            </div>
        </mat-sidenav-container>

        <div class="data-table">
            <app-grid [ELEMENT_DATA]="ELEMENT_DATA"></app-grid>
        </div>

        <div class="pagenator">
            <app-pagenator [length]="(pagedData ?? []).length"
                [pageSize]="5"
                [pageSizeOptions]="[5,10,20]"
                (pageChanged)="onPageChange($event)">
            </app-pagenator>
        </div>
    </div>
</div>
