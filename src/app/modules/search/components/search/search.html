<div class="search-container">
    <div class="search-pannal">
        <mat-sidenav-container>
            <div class="search-form-container">
                <div class="top-filters">
                    <app-top-filters [filterConfig]="filterConfig">
                    </app-top-filters>
                </div>
                <div class="more-filters">
                    <app-more-filters [filterConfig]="filterConfig">
                    </app-more-filters>
                </div>
            </div>
        </mat-sidenav-container>

        <!-- @if(ELEMENT_DATA.length >0){} -->
            <div class="data-table">
                <app-grid [ELEMENT_DATA]="ELEMENT_DATA"
                ></app-grid>
            </div>
        
        <!-- @else{
            <div class="data-not-come">
                <p>Search Data Not Present</p>
            </div>
        } -->

        @if(ELEMENT_DATA.length != 0){
            <div class="pagenator">
                <app-pagenator [length]="pagedData?.length ?? 0" 
                    [pageIndex]="pageState.pageIndex"
                    [pageSize]="pageState.pageSize" 
                    [pageSizeOptions]="[10,20,30,40,50]"
                    (pageChanged)="onPageChange($event)">
                </app-pagenator>
            </div>
        }

    </div>
</div>
